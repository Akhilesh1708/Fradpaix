<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Login — Fradpaix</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #040a12;
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(44,79,196,0.18) 0%, transparent 70%);
    }

    /* ---- card ---- */
    .login-wrap { width: min(100%, 420px); }
    .login-brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 36px; text-decoration: none;
    }
    .login-brand img  { height: 40px; }
    .login-brand span {
      font-family: var(--ff-serif); font-size: 1.1rem;
      font-weight: 700; letter-spacing: .14em; color: #fff;
    }
    .login-card {
      background: #02050d;
      border: 1px solid #172642;
      border-radius: 18px;
      padding: 40px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
    }
    .login-eyebrow {
      font-size: 0.68rem; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: #2f7df6; margin-bottom: 10px;
      display: block;
    }
    .login-title {
      font-family: var(--ff-serif); font-size: 1.9rem; font-weight: 700;
      color: #fff; line-height: 1.2; margin-bottom: 6px;
    }
    .login-sub { color: #7f8ba0; font-size: .88rem; margin-bottom: 32px; }

    /* ---- role tabs ---- */
    .role-tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 28px;
    }
    .role-tab {
      padding: 12px; border: 1px solid #1a2b47; border-radius: 10px;
      background: #010308; color: #7f8ba0; font: 600 .82rem var(--ff-sans);
      letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
      transition: all .2s; text-align: center;
    }
    .role-tab.active {
      border-color: #2c4fc4; background: #071028; color: #fff;
    }
    .role-tab svg { display: block; margin: 0 auto 6px; width: 22px; height: 22px; }

    /* ---- fields ---- */
    .login-group { margin-bottom: 20px; }
    .login-group label {
      display: block; color: #abc4e7; font-size: .72rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px;
    }
    .login-group input {
      width: 100%; min-height: 48px; background: #010308;
      border: 1px solid #1a2b47; border-radius: 10px;
      color: #fff; padding: 12px 16px; font: 400 .95rem var(--ff-sans);
      transition: border-color .2s;
    }
    .login-group input:focus {
      outline: none; border-color: #2f7df6;
      box-shadow: 0 0 0 3px rgba(47,125,246,.15);
    }

    /* ---- error ---- */
    .login-error {
      display: none; margin-bottom: 18px; padding: 12px 16px;
      background: #1c040a; border: 1px solid #6e2a2a; border-radius: 8px;
      color: #ffb3bf; font-size: .85rem;
    }

    /* ---- submit ---- */
    .login-btn {
      width: 100%; min-height: 52px; background: #2c4fc4; border: 0;
      border-radius: 12px; color: #fff; font: 700 .9rem var(--ff-sans);
      letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
      transition: opacity .2s; margin-top: 4px;
    }
    .login-btn:hover { opacity: .85; }

    /* ---- footer note ---- */
    .login-note {
      margin-top: 20px; text-align: center;
      color: #3d5066; font-size: .78rem;
    }

    /* ---- credentials hint (dev helper) ---- */
    .login-hint {
      margin-top: 28px; padding: 14px 16px;
      background: #010308; border: 1px solid #0f1e36; border-radius: 10px;
    }
    .login-hint p { color: #3d5066; font-size: .75rem; margin-bottom: 6px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .login-hint code { color: #6a88aa; font-size: .8rem; font-family: monospace; display: block; line-height: 1.8; }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="login-wrap">
    <a href="index.html" class="login-brand">
      <img src="logo.png" alt="Fradpaix" />
      <span>FRADPAIX</span>
    </a>

    <div class="login-card">
      <span class="login-eyebrow">Private Workspace</span>
      <h1 class="login-title">CRM Login</h1>
      <p class="login-sub">Sign in to manage leads and bookings.</p>

      <!-- Role selector -->
      <div class="role-tabs" role="group" aria-label="Select role">
        <button type="button" class="role-tab active" data-role="admin">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z" fill="currentColor"/></svg>
          Admin
        </button>
        <button type="button" class="role-tab" data-role="manager">
          <svg viewBox="0 0 24 24" fill="none"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C16.19 13.89 17 15.02 17 16.5V19h5v-2.5C22 14.17 17.33 13 16 13z" fill="currentColor"/></svg>
          Manager
        </button>
      </div>

      <div class="login-error" id="crm-login-error"></div>

      <form id="crm-login-form" novalidate>
        <input type="hidden" id="crm-role" value="admin" />
        <div class="login-group">
          <label for="crm-password">Password</label>
          <input type="password" id="crm-password" autocomplete="current-password"
                 placeholder="Enter your password" required />
        </div>
        <button type="submit" class="login-btn">Sign In →</button>
      </form>

      <p class="login-note">Access restricted to authorised team members only.</p>

     
    </div>
  </div>

  <script src="crm-auth.js"></script>
  <script>
    // Role tab switching
    const tabs      = document.querySelectorAll('.role-tab');
    const roleInput = document.getElementById('crm-role');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        roleInput.value = tab.dataset.role;
      });
    });
    // If already logged in, skip login
    if (CRM_AUTH.isLoggedIn()) window.location.assign('crm.html');
    initCrmLogin();
  </script>
</body>
</html>
